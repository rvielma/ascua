[package]
name = "demo"
description = "Demo de Ascua: SSR + islas + router, compartiendo componentes entre servidor y cliente."
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# Generador del HTML: corre en el servidor (Rust nativo, sin WASM) y usa los
# mismos componentes que el cliente.
[[bin]]
name = "generar"
path = "src/bin/generar.rs"

[dependencies]
ascua = { path = "../../crates/ascua", features = ["web"] }
wasm-bindgen = "0.2"

[profile.release]
opt-level = "s"
lto = true
