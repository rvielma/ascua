[package]
name = "sitio"
description = "El sitio de Ascua, construido con Ascua."
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# Genera el HTML del sitio. Corre en Rust nativo: el mismo código de
# componentes que luego hidrata el navegador.
[[bin]]
name = "generar"
path = "src/bin/generar.rs"

[dependencies]
ascua = { path = "../crates/ascua", features = ["web"] }
wasm-bindgen = "0.2"

[profile.release]
opt-level = "s"
lto = true
