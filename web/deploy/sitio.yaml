# El sitio de Ascua en el cluster GCP, junto a stil, hull y condor.
#
# Hull con serve:static — son ficheros: un index.html que es HTML de verdad, el
# JavaScript de los tres demos y el playground con su .wasm. No hay servidor de
# aplicación que mantener.
name: ascua-site
domain: ascua.gitweave.run
replicas: 2
build:
  cwd: ../
  # `./build.sh` = playground (vite) + sitio (vite). El store va al que ya
  # existe en este volumen: clonefile no cruza volúmenes.
  cmd: >-
    STIL_STORE=/Volumes/Working/.stil-store ./build.sh
  output: dist
runtime:
  serve: static
  port: 3013
  memory: 64M
  cpu: 0.5
  pids: 32
health: /
