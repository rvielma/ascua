# Tipos MIME para el httpd de busybox, que es lo que Hull arranca con
# `serve: static` (`/bin/httpd -f -h /www`).
#
# Busybox lo busca en el directorio que sirve antes que en /etc, así que el
# sitio puede corregir su propia tabla sin tocar la infraestructura. Y no lo
# sirve como contenido: el propio httpd.conf queda fuera de lo público.
#
# Sin `.wasm`, el playground recibe el compilador sin `content-type` y el
# navegador no puede usar `instantiateStreaming` —compilar mientras descarga—,
# así que cae al camino lento de bajarlo entero primero.
.wasm:application/wasm

# El resto son los que la tabla interna tampoco trae y este sitio puede acabar
# sirviendo. Cuestan una línea; el fallo, en cambio, no da la cara.
.mjs:text/javascript
.webmanifest:application/manifest+json
.avif:image/avif
.webp:image/webp
.woff2:font/woff2
.json:application/json
